name: Build pinpam-module

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [README.md]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: debian:testing
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential debhelper equivs devscripts fakeroot
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Debian package
        run: |
          mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control
          dpkg-parsechangelog -l debian/changelog >/dev/null
          ./gh-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pinpam-module-${{ matrix.runner }}
          path: pinpam-module_*.deb
          if-no-files-found: error
