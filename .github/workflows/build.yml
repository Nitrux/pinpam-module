name: Build and push packages to PackageCloud.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [README.md]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:testing-20260713-slim
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Configure Debian snapshot
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          cat > /etc/apt/sources.list.d/debian.sources <<'EOF_SOURCES'
          Types: deb
          URIs: https://snapshot.debian.org/archive/debian/20261105T143010Z
          Suites: testing
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Check-Valid-Until: no
          EOF_SOURCES
          apt-get update
          apt-get -y dist-upgrade
          apt-get install -y --no-install-recommends ruby-dev

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build package
        run: ./gh-build.sh

      - name: Install PackageCloud client
        run: gem install --no-document package_cloud

      - name: Push package
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: package_cloud push nitrux/testing/debian/duke ./pinpam-module_*.deb

  build-arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:testing-20260713-slim
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Configure Debian snapshot
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          cat > /etc/apt/sources.list.d/debian.sources <<'EOF_SOURCES'
          Types: deb
          URIs: https://snapshot.debian.org/archive/debian/20261105T143010Z
          Suites: testing
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Check-Valid-Until: no
          EOF_SOURCES
          apt-get update
          apt-get -y dist-upgrade
          apt-get install -y --no-install-recommends ruby-dev

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build package
        run: ./gh-build.sh

      - name: Install PackageCloud client
        run: gem install --no-document package_cloud

      - name: Push package
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: package_cloud push nitrux/testing/debian/duke ./pinpam-module_*.deb
